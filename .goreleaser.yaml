# GoReleaser v2 configuration. See https://goreleaser.com
version: 2

project_name: mantisbt-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}} -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Specifying files replaces the default set, so list the docs explicitly
    # and bundle the agent skill alongside the binary.
    files:
      - LICENSE
      - README.md
      - skills/**/*
    # Windows users expect zip archives.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  # The default `git` provider prefixes every entry with the full commit SHA1;
  # -1 drops the hash and leaves just the subject.
  abbrev: -1
  # Grouping is matched against the subject line, which GoReleaser prefixes with
  # the commit SHA1 — hence the leading `^.*?` in each pattern.
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  prerelease: auto
